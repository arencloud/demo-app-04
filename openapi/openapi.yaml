openapi: 3.0.3
info:
  title: Demo App 04
  version: 1.0.0
  description: Demo
servers:
  - url: https://api.example.invalid
    description: Replaced by the admitted Gateway API hostname after onboarding
paths:
  /demo04:
    get:
      operationId: getdemo-app-04
      summary: Invoke Demo App 04
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required: [api, message]
                properties:
                  api: {type: string}
                  message: {type: string}
                  request: {type: string}
        '401': {description: A valid API key or Keycloak token is required}
        '403': {description: An active subscription is required}
        '429': {description: The selected plan limit has been reached}
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: Authorization
      description: Use `APIKEY <credential>`.
    keycloak:
      type: openIdConnect
      openIdConnectUrl: https://keycloak.example.invalid/realms/api-monetization/.well-known/openid-configuration
security:
  - apiKey: []
  - keycloak: []


apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-app-04-api-key
  namespace: api-monetization-apps
  annotations: {argocd.argoproj.io/sync-wave: "10"}
  labels: {app.kubernetes.io/name: 'demo-app-04'}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: api-monetization
      namespace: api-monetization-gateway
      sectionName: http
  hostnames: [api-monetization.apps.cl02.arencloud.com]
  rules:
    - matches:
        - method: GET
          path: {type: PathPrefix, value: '/demo04'}
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - {name: Access-Control-Allow-Origin, value: "*"}
              - {name: Access-Control-Expose-Headers, value: "X-Monetization-Billable-Units, X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset"}
      backendRefs:
        - {group: '', kind: Service, name: 'demo-app-04', port: 8080, weight: 1}
---

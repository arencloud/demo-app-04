apiVersion: extensions.kuadrant.io/v1alpha1
kind: PlanPolicy
metadata:
  name: demo-app-04-plans
  namespace: api-monetization-apps
  annotations: {argocd.argoproj.io/sync-wave: "30"}
spec:
  targetRef: {group: gateway.networking.k8s.io, kind: HTTPRoute, name: 'demo-app-04-api-key'}
  plans:
    - tier: enterprise
      predicate: auth.identity.metadata.annotations['secret.kuadrant.io/plan-id'] == "enterprise"
      limits: {}
    - tier: developer
      predicate: auth.identity.metadata.annotations['secret.kuadrant.io/plan-id'] == "developer"
      limits:
        monthly: 1000000
        custom:
          - limit: 1000
            window: 1m
    - tier: free
      predicate: auth.identity.metadata.annotations['secret.kuadrant.io/plan-id'] == "free"
      limits:
        monthly: 1000
        custom:
          - limit: 10
            window: 1m
---
apiVersion: kuadrant.io/v1
kind: RateLimitPolicy
metadata:
  name: demo-app-04-jwt
  namespace: api-monetization-apps
  annotations: {argocd.argoproj.io/sync-wave: "30"}
spec:
  targetRef: {group: gateway.networking.k8s.io, kind: HTTPRoute, name: 'demo-app-04-jwt'}
  limits:
    free:
      rates:
        - limit: 10
          window: 1m
        - limit: 1000
          window: 720h
      counters:
        - expression: auth.kuadrant.customer
      when:
        - predicate: auth.kuadrant.plan == "free"
    developer:
      rates:
        - limit: 1000
          window: 1m
        - limit: 1000000
          window: 720h
      counters:
        - expression: auth.kuadrant.customer
      when:
        - predicate: auth.kuadrant.plan == "developer"

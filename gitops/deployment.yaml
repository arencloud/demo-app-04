apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app-04
  namespace: api-monetization-apps
  labels:
    app.kubernetes.io/name: demo-app-04
    backstage.io/kubernetes-id: demo-app-04
  annotations:
    app.openshift.io/vcs-uri: https://github.com/arencloud/demo-app-04.git
    app.openshift.io/vcs-ref: main
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"demo-app-04:latest","namespace":"api-monetization-apps"},"fieldPath":"spec.template.spec.containers[?(@.name==\"api\")].image","paused":false}]
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: 'demo-app-04'}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-app-04
        app.kubernetes.io/component: backend-api
        backstage.io/kubernetes-id: demo-app-04
        sidecar.istio.io/inject: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: image-registry.openshift-image-registry.svc:5000/api-monetization-apps/demo-app-04:latest
          imagePullPolicy: Always
          ports:
            - {name: http, containerPort: 8080}
            - {name: openapi, containerPort: 8082}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: 'demo-app-04'}
